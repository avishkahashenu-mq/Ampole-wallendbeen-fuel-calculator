<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampol Wallendbeen Fuel Sheet Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Ampol Wallendbeen Fuel Sheet Calculator</h2>

    <form id="fuelForm">

        <h3>Pump Section</h3>

        <label for="pump1">Pump 1 Reading:</label>
        <input type="number" id="pump1"><br><br>

        <label for="pump2">Pump 2 Reading:</label>
        <input type="number" id="pump2"><br><br>

        <label for="pump3">Pump 3 Reading:</label>
        <input type="number" id="pump3"><br><br>

        <label for="pump4">Pump 4 Reading:</label>
        <input type="number" id="pump4"><br><br>

        <label for="lastReading">Total Last Reading:</label>
        <input type="number" id="lastReading"><br><br>

        <h3>Tank Section</h3>

        <label for="stock">Total Stock Underground:</label>
        <input type="number" id="stock"><br><br>

        <label for="previousDip">Previous Dip Reading:</label>
        <input type="number" id="previousDip"><br><br>

        <label for="delivery">Plus Delivery Received:</label>
        <input type="number" id="delivery"><br><br>

        <label for="prevVariance">Previous Cumulative Variance:</label>
        <input type="number" id="prevVariance"><br><br>

        <button type="button" onclick="calculate()">Calculate</button>
        <button type="button" onclick="resetForm()">Reset</button>

    </form>

    <hr>

    <h3>Results</h3>

    <p>Total This Reading: <span id="totalReading"></span></p>
    <p>Litres Sold: <span id="litresSold"></span></p>
    <p>Total (Dip + Delivery): <span id="totalDip"></span></p>
    <p>Sales by Dip Stock: <span id="salesDip"></span></p>
    <p>Daily Variance: <span id="dailyVar"></span></p>
    <p>Cumulative Variance: <span id="cumVar"></span></p>

    <script src="script.js"></script>

</body>
</html>
