<!DOCTYPE html>
<html>
<head>
    <title>Fuel Sheet Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Ampole Wallendebeen Fuel Sheet Calculator</h2>

<h3>Pump Section</h3>

<label>Pump 1 Reading:</label>
<input type="number" id="pump1"><br>

<label>Pump 2 Reading:</label>
<input type="number" id="pump2"><br>

<label>Pump 3 Reading:</label>
<input type="number" id="pump3"><br>

<label>Pump 4 Reading:</label>
<input type="number" id="pump4"><br>

<label>Total Last Reading:</label>
<input type="number" id="lastReading"><br>

<h3>Tank Section</h3>

<label>Total Stock Underground:</label>
<input type="number" id="stock"><br>

<label>Previous Dip Reading:</label>
<input type="number" id="previousDip"><br>

<label>Plus Delivery Received:</label>
<input type="number" id="delivery"><br>

<label>Previous Cumulative Variance:</label>
<input type="number" id="prevVariance"><br><br>

<button onclick="calculate()">Calculate</button>

<h3>Results</h3>

<p>Total This Reading: <span id="totalReading"></span></p>
<p>Litres Sold: <span id="litresSold"></span></p>
<p>Total (Dip + Delivery): <span id="totalDip"></span></p>
<p>Sales by Dip Stock: <span id="salesDip"></span></p>
<p>Daily Variance: <span id="dailyVar"></span></p>
<p>Cumulative Variance: <span id="cumVar"></span></p>

<script src="script.js"></script>
</body>
</html>
